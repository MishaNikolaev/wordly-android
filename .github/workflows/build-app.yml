name: App

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provide google-services.json
        run: |
          mkdir -p app/src/dev app/src/mock
          cp .github/workflows/google-services.json app/src/dev/google-services.json
          cp .github/workflows/google-services.json app/src/mock/google-services.json

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
